name: Dual-package installation
on:
  push:
    paths: ['models/**', 'docs/IMPLEMENTATION_*.zh-CN.md', 'docs/TESTING.md', 'docs/NUMERICAL_CONTRACT.md', 'docs/ARCHITECTURE.md', 'docs/BUILD_AND_INSTALL.md', 'docs/COMPATIBILITY.md', '.github/workflows/dual-package.yml']
  pull_request:
    paths: ['models/**', 'docs/IMPLEMENTATION_*.zh-CN.md', 'docs/TESTING.md', 'docs/NUMERICAL_CONTRACT.md', 'docs/ARCHITECTURE.md', 'docs/BUILD_AND_INSTALL.md', 'docs/COMPATIBILITY.md', '.github/workflows/dual-package.yml']

permissions:
  contents: read

jobs:
  install-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - run: git rev-parse HEAD
      - run: python3 models/tests/install_matrix.py --generator 'Unix Makefiles'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install -r models/tests/qualification-requirements.txt -r models/tests/beta-requirements.txt
      - run: |
          cmake -S models -B "$RUNNER_TEMP/qualified-models" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/qualified-models" --parallel 4
          python models/tests/qualify_interval.py "$RUNNER_TEMP/qualified-models/models_interval_probe"
          python models/tests/qualify_beta.py "$RUNNER_TEMP/qualified-models/models_beta_probe"
      - run: |
          cmake -S models -B "$RUNNER_TEMP/sanitized-models" -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -fsanitize=undefined,address -fno-omit-frame-pointer -fno-pie" -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=undefined,address -no-pie"
          cmake --build "$RUNNER_TEMP/sanitized-models" --parallel 4
          ctest --test-dir "$RUNNER_TEMP/sanitized-models" --output-on-failure
